#################
### HYPRLOCK ###
#################

# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Gruvbox lock screen: date + clock up top, the input field fades in below
# the Arch logo once you start typing.

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true # Enter on an empty field isn't a failed attempt
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # resolves through the ~/.config/hypr -> dotfiles/hypr symlink
    path = ~/.config/hypr/wallpapers/lock-blue.png
    # path = ~/.config/hypr/wallpapers/lock-dark.png
    color = rgb(29, 32, 33) # Gruvbox bg-hard, shown if the image is missing
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(235, 219, 178)          # Gruvbox fg #ebdbb2
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 22
    check_color = rgba(184, 187, 38, 0.8)    # Gruvbox green
    fail_color = rgba(251, 73, 52, 0.8)      # Gruvbox red
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(250, 189, 47, 0.8) # Gruvbox yellow
    position = 0, -260 # 60px lower than -200 to make room for the greeting under the logo
    halign = center
    valign = center
    font_family = JetBrainsMono Nerd Font
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d, %Y"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 0.9)
    position = 0, -30
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = <b>$TIME</b>
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1.0)
    position = 0, -120
    halign = center
    valign = top
}

# Unlock prompt: between the clock and the Arch logo; at the screen centre
# it would sit on the logo's white and be unreadable
label {
    monitor =
    text = Click or press any key to unlock
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 0.5)
    position = 0, 200
    halign = center
    valign = center
}

# Greeting, just above the input field and clear of the logo
label {
    monitor =
    text = Welcome, $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 0.7)
    position = 0, -200
    halign = center
    valign = center
}
